name: SN-R1 OpenWrt 25.12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget

      - name: Clone OpenWrt 25.12
        run: |
          git clone \
            --branch openwrt-25.12 \
            --depth 1 \
            https://github.com/openwrt/openwrt.git \
            openwrt

      - name: Inject SN-R1 Board Files
        run: |
          cp -av target/linux/mediatek/dts/* openwrt/target/linux/mediatek/dts/
          cp -av target/linux/mediatek/image/filogic.mk openwrt/target/linux/mediatek/image/filogic.mk

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware for SN-R1
        working-directory: openwrt
        run: |
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_snr1_bt-snr1=y" >> .config
          make defconfig

      - name: Build firmware image
        working-directory: openwrt
        run: |
          make V=s -j$(nproc)

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-mediatek-filogic-snr1_bt-snr1-firmware
          path: openwrt/bin/targets/mediatek/filogic/*
