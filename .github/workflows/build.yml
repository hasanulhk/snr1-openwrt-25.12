name: SN-R1 OpenWrt 25.12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget

      - name: Clone OpenWrt 25.12
        run: |
          git clone \
            --branch openwrt-25.12 \
            --depth 1 \
            https://github.com/openwrt/openwrt.git \
            openwrt

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build system check
        working-directory: openwrt
        run: |
          make defconfig

      - name: Show OpenWrt revision
        working-directory: openwrt
        run: |
          git describe --tags --always
          git log -1 --oneline
